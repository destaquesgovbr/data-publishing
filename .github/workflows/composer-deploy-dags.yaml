name: Deploy Publishing DAGs to Airflow

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'src/data_publishing/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Publica no bucket do Airflow próprio (destaquesgovbr-airflow). A lista de buckets é
    # o default do reusable workflow: o do Composer sai dela no desligamento, só lá.
    uses: destaquesgovbr/reusable-workflows/.github/workflows/airflow-deploy-dags.yml@v3
    with:
      dags_local_path: dags
      dags_bucket_subdir: data-publishing
      plugins_local_path: src/data_publishing
      check_imports: true
      rsync_exclude: 'requirements\.txt$'
